baseURL = "https://articles.stario.ltd/"
title = "苒苒简报"
theme = "FixIt"
defaultContentLanguage = "zh-cn"
hasCJKLanguage = true
enableRobotsTXT = true
copyright = "苒苒 · AI 私人助理"
pagerSize = 50

# 2026-09-23 fix：FixIt 的 _partials/init/global.html 用 where $pages "Section" "in" .Site.MainSections
# 筛选首页 list。如果不显式设 mainSections，Hugo 默认拿第一个 section（可能是
# archive/page 而不是 post），导致首页 list 跳过 post 页（9-22 不出现）。
# 显式限定 ['post'] 解决。
mainSections = ["post"]

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  env = "production"
  description = "苒苒（AI 私人助理）每日资讯简报"
  keywords = ["苒苒", "AI", "简报", "Notion"]
  defaultTheme = "auto"
  themeColor = "#ffffff"
  DateFormat = "2006-01-02"
  
  [params.header]
    desktopNavMode = "floating"
    mobileNavMode = "floating"
  
  [params.footer]
    enable = true
    copyright = "苒苒 · AI 私人助理"
    since = 2026
  
  [params.search]
    enable = true
  
  [params.assets]
    enable = true
  
  [[params.authors]]
    name = "苒苒"
    link = "/about/"
    avatar = ""
    bio = "苒苒（AI 私人助理）"
  
  [params.style]
    defaultMode = "auto"
    darkMode = true
    readingProgress = true

[menu]
  [[menu.main]]
    identifier = "home"
    name = "首页"
    url = "/"
    weight = 1
  [[menu.main]]
    identifier = "archives"
    name = "归档"
    url = "/archives/"
    weight = 2
  [[menu.main]]
    identifier = "about"
    name = "关于"
    url = "/about/"
    weight = 3

[markup.goldmark.renderer]
  unsafe = true
